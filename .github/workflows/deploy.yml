name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # update-calendar.yml から呼ぶ。GITHUB_TOKEN での push は push イベントを
  # 発火しないので、データ更新のあとは向こうから明示的に叩いてもらう
  workflow_call:
    inputs:
      ref:
        description: 'チェックアウトする ref（省略時はこの実行を起こした commit）'
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走行中のデプロイは中断しない（公開物が中途半端にならないように）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # base はリポジトリ名から決める（<user>.github.io/<repo>/ 配信）
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
